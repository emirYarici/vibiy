services:
  vibiy-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibiy-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    env_file:
      - .env
    volumes:
      # Mount serviceAccountKey.json at runtime (keep it out of the image)
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/thumbnail?url=test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
